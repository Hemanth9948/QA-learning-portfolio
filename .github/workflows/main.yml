
name: ShopEasy QA Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  html-validation:
    name: HTML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes htmlhint "ShopEasy-Demo-Store/*.html"

  browser-testing:
  name: Playwright Smoke Testing
  runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Execute QA Tests
        run: npm test

